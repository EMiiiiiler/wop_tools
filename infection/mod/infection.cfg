// World of Padman - Infection
// start:  wop +set fs_game infection +exec infection.cfg +map <mapname>
// (g_gametype and g_infection are latched: exec this before the map loads, or type "map_restart" / load a map after)

set g_gametype 6            // Free For All Team - Infection is a modifier on it
set g_infection 1

set g_inf_prepTime 120      // seconds the survivors get before the infected are released
set g_inf_roundTime 300     // seconds the survivors must hold out after the release (0 = until everyone is infected)
set g_inf_startInfected 0   // infected at the start of a round (0 = auto: 1, or 2 with six or more players)
set g_inf_humanRole 0       // you (human players): 0 = picked at random, 1 = always start as survivor, 2 = always start infected
set g_inf_infectedPrepTime 30 // shorter preparation when every human starts infected (-1 = always the full time)
set g_inf_surviveBonus 5    // points for each survivor still alive when the time runs out

// the first infected of a round
set g_inf_meleeDamage 100   // damage of any infected punch (survivors have 100 health; armour saves them once)
set g_inf_meleeRange 64     // reach of their punch (normal punchy: 32)
set g_inf_infectedSpeed 1.15 // speed factor, on top of the punchy's 1.3
set g_inf_infectedArmor 100 // armour they spawn with

// survivors who got infected are weaker, so a round builds up to a last stand
set g_inf_convertedRange 48
set g_inf_convertedSpeed 1.0
set g_inf_convertedArmor 0

// bots
set g_inf_botAwareness 1    // 1 = infected bots only know where a survivor fired, was seen or was pinged; 0 = they always know
set g_inf_pingInterval 15   // seconds between "pings" that tell the infected bots where every survivor is (0 = never)
set g_inf_botHoldLead 30    // seconds before the release at which survivor bots stop collecting and take up positions
set g_inf_botEscort 2       // survivor bots that come and find each human survivor when it is time to take positions
set g_inf_botJoinOnSight 1  // 1 = every other survivor bot that sees a human survivor joins the group and defends with them

// difficulty that follows you
set g_inf_adaptive 1        // 1 = one level up after each round the humans win, one down after each they lose (-4..6)
                            //     a level = 3% speed and 15 armour for the infected, every 2nd level one more infected;
                            //     when you play infected it works the other way round (survivors get 20 armour per level)
// set g_inf_level 0        // current level; kept between sessions, uncomment to reset it on every start

set pointlimit 5            // rounds a side must win (red = infected, blue = survivors)
set timelimit 30
set g_teamAutoJoin 1
set g_teamForceBalance 0
set g_friendlyFire 0
set g_doWarmup 0
set bot_minplayers 8        // fill up to 8 players with bots (0 = no bots)
